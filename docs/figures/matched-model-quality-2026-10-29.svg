<text x="72" y="1025" fill="#586c7d" font-size="18" font-weight="normal" text-anchor="start">Four story prefixes; three instructions. TinyTalk 1 gets a generous literal pass for the rain question; sentence status is debatable.</text>
<text x="72" y="1051" fill="#586c7d" font-size="18" font-weight="normal" text-anchor="start">Visible resolution and EOS are different. A capped story can have a resolution. See full texts and scoring notes.</text>
<rect x="48" y="1092" width="1504" height="104" rx="14" fill="#dce9f2"/>
<text x="72" y="1131" fill="#193347" font-size="27" font-weight="bold" text-anchor="start">Training objective matters. Extra model bytes do not ensure reliable instructions.</text>
<text x="72" y="1168" fill="#586c7d" font-size="22" font-weight="normal" text-anchor="start">TinyTalk 1 vs 2 also changes size and training data; these results do not isolate either cause.</text>
<text x="48" y="1230" fill="#586c7d" font-size="18" font-weight="normal" text-anchor="start">One deterministic output per model/task; same unblinded reviewer; possible training overlap. No general or German assistant qualification.</text>
