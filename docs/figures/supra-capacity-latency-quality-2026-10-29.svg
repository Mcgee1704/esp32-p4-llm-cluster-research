<text x="72" y="981" fill="#586c7d" font-size="20" font-weight="normal" text-anchor="start">Values are MiB. Flash compression saves no runtime RAM.</text>
<rect x="813" y="635" width="739" height="375" rx="14" fill="white"/>
<text x="837" y="678" fill="#193347" font-size="26" font-weight="bold" text-anchor="start">Quantization can erase a correct answer</text>
<text x="837" y="719" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">100M · exact author ChatML bicycle question</text>
<text x="837" y="766" fill="#8557a6" font-size="22" font-weight="bold" text-anchor="start">Host: F16 source / FP32 compute:</text>
<text x="837" y="805" fill="#193347" font-size="25" font-weight="normal" text-anchor="start">“A standard bicycle has 2 wheels…”</text>
<text x="837" y="854" fill="#b78437" font-size="22" font-weight="bold" text-anchor="start">Row-INT4 / both real P4s:</text>
<text x="837" y="893" fill="#193347" font-size="25" font-weight="normal" text-anchor="start">“around 2.5-3.5 wheels…”</text>
<text x="837" y="944" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">P4 INT4 matches its quantized host reference.</text>
<text x="837" y="981" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Larger-model execution ≠ reliable factual answers.</text>
<text x="48" y="1064" fill="#586c7d" font-size="22" font-weight="normal" text-anchor="start">Latency includes prefill. Decode rate excludes prefill using first-token time; final bookkeeping remains included.</text>
<text x="48" y="1101" fill="#586c7d" font-size="22" font-weight="normal" text-anchor="start">Tokenizers differ; S2 uses 20 prompt tokens in both. No single-P4 speedup baseline or global quality ranking.</text>
<text x="48" y="1138" fill="#586c7d" font-size="22" font-weight="normal" text-anchor="start">Primary 50M timing: firmware 0.6.0; 100M: 0.6.1. Lossless-loading control confirms identical 50M output.</text>
</svg>
