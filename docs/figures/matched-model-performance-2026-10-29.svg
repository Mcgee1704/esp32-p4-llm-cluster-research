<text x="48" y="1045" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Matched input text is not equal computational work: tokenizers, prompt lengths and generated contents differ.</text>
<text x="48" y="1080" fill="#586c7d" font-size="20" font-weight="normal" text-anchor="start">Characters/s reduces tokenizer-unit bias, but is not a quality-adjusted speed score. Repeats measure this fixed workload.</text>
<text x="48" y="1123" fill="#586c7d" font-size="19" font-weight="normal" text-anchor="start">64 direct quality cases + 64 dispatched timing jobs; all model-specific token/text/EOS references match. No third-node or energy claim.</text>
