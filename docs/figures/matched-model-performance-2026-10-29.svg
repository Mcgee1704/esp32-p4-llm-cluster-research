<text x="72" y="761" fill="#193347" font-size="28" font-weight="bold" text-anchor="start">Two-board output rate on this workload</text>
<text x="72" y="804" fill="#3378ad" font-size="21" font-weight="bold" text-anchor="start">TinyStories-15M SFT</text>
<text x="72" y="850" fill="#3378ad" font-size="32" font-weight="bold" text-anchor="start">4.47 tokens/s</text>
