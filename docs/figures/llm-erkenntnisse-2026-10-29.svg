<text x="804" y="1069" font-size="36" font-weight="bold" text-anchor="start" style="fill:#182e40">1.92x throughput</text>
<text x="804" y="1102" font-size="21" font-weight="normal" text-anchor="start" style="fill:#526779">4 paired blocks ·16 jobs</text>
<text x="804" y="1150" font-size="19" font-weight="normal" text-anchor="start" style="fill:#526779">No speed comparison with SFT here:</text>
<text x="804" y="1178" font-size="19" font-weight="normal" text-anchor="start" style="fill:#526779">its timing experiment used different prompts.</text>
<text x="48" y="1256" font-size="27" font-weight="bold" text-anchor="start" style="fill:#182e40">Shared finding</text>
<text x="48" y="1296" font-size="24" font-weight="normal" text-anchor="start" style="fill:#182e40">Parallelism increases throughput. More model bytes do not guarantee better answers.</text>
<text x="48" y="1331" font-size="23" font-weight="normal" text-anchor="start" style="fill:#526779">No evidence of a reliable general-purpose or German-language assistant.</text>
<text x="48" y="1375" font-size="16" font-weight="normal" text-anchor="start" style="fill:#526779">Data: qualityV1 · TinyTalk host checks · GPT-Neo P4. SFT =0rn0/llama2-15m-tinystories-sft.</text>
