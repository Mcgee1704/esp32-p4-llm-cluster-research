<text x="72" y="964" fill="#193347" font-size="28" font-weight="bold" text-anchor="start">Correctness and deployment decision</text>
<text x="72" y="1007" fill="#193347" font-size="22" font-weight="normal" text-anchor="start">27 real streams: exact token IDs, decoded bytes/text and EOS versus archived native references.</text>
