<text x="72" y="1123" fill="#193347" font-size="22" font-weight="normal" text-anchor="start">Both P4s retain firmware 0.6.1 and row-INT4. No new C kernel, device latency or on-device quality result.</text>
<text x="48" y="1197" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Lexical screen misses negation and confuses the article “a” with the letter A; manual audit records these errors.</text>
