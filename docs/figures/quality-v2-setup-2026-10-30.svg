<rect x="48" y="891" width="1504" height="174" rx="14" fill="#dce9f2"/>
<text x="72" y="936" fill="#193347" font-size="27" font-weight="bold" text-anchor="start">No quality-output reuse; exact runtime reference equality for all51 streams.</text>
<text x="72" y="981" fill="#193347" font-size="23" font-weight="normal" text-anchor="start">Same assistant designed tasks and judged outputs. Style/length may reveal identity despite labels.</text>
<text x="72" y="1024" fill="#193347" font-size="23" font-weight="normal" text-anchor="start">Final recorded state: genuine TinyBrainBot restored on both0.9.0 boards; ready/idle, queue empty.</text>
<text x="48" y="1111" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Different native wrappers/tokenizers; greedy outputs; fixed model order. Quality-case durations are unequal work.</text>
