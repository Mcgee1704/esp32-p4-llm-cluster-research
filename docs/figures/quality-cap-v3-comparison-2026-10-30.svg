<text x="72" y="1192" fill="#193347" font-size="26" font-weight="bold" text-anchor="start">43 new quality runs +5 reused early-EOS answers; both boards in every new run.</text>
<text x="72" y="1235" fill="#193347" font-size="24" font-weight="normal" text-anchor="start">All 48 higher references preserve the old token prefix. Old EOS answers stay exactly identical.</text>
<text x="72" y="1278" fill="#193347" font-size="23" font-weight="normal" text-anchor="start">? = uncertain whole-response judgment, never counted as confirmed success. No pooled total.</text>
<text x="48" y="1368" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Same author knows the old outputs; higher labels were masked until ratings were committed. Not independent or fully blind.</text>
<text x="48" y="1411" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Known constructed tasks, n=4/category. More generated tokens are extra work, not a faster-kernel result.</text>
