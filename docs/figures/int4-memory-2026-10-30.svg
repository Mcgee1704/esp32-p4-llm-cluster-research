<text x="1505" y="291" fill="#193347" font-size="21" font-weight="normal" text-anchor="end">3.071 ms</text>
<text x="48" y="353" fill="#193347" font-size="24" font-weight="bold" text-anchor="start">Read PSRAM1MiB</text>
