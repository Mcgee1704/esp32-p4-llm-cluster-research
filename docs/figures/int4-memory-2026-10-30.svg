<rect x="48" y="925" width="1504" height="145" rx="14" fill="#dce9f2"/>
<text x="72" y="966" fill="#193347" font-size="25" font-weight="bold" text-anchor="start">Blue: coordinator. Green: worker. Each workload matches its independent reference on both boards.</text>
<text x="72" y="1008" fill="#586c7d" font-size="23" font-weight="normal" text-anchor="start">Matrix streaming penalty ~10–11% here; single-core synthetic data, not an end-to-end model speedup.</text>
<text x="72" y="1047" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Different loops measure different workloads. Do not subtract read time to claim pure arithmetic or bus bandwidth.</text>
<text x="48" y="1120" fill="#586c7d" font-size="21" font-weight="normal" text-anchor="start">Read1MiB batch:8 scans; all other batches:42 calls. Timed spans exclude explicit yields. Compare within each workload.</text>
</svg>
